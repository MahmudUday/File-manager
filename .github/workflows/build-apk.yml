name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate release signing keystore if missing
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass onyxfiles123 \
              -alias upload \
              -keypass onyxfiles123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OnyxFiles,O=Onyx,C=US"
          fi

      - name: Build Optimized Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: onyxfiles123
          KEY_PASSWORD: onyxfiles123
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Onyx Files Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OnyxFiles-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
